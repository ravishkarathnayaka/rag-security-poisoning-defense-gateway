name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Pytest Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check gateway/ api/ tests/ test_data/

      - name: Generate Synthetic Test Corpus
        run: |
          python test_data/generate_test_corpus.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --cov=gateway --cov=api --cov-report=term-missing
