[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-security-poisoning-defense-gateway"
version = "1.0.0"
description = "Multi-stage defensive security gateway protecting enterprise RAG pipelines against poisoning, vector tampering, and indirect prompt injection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ravishka Rathnayaka" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "api*"]
exclude = ["tests*", "test_data*", "docker*", "public*", "chroma_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[project.scripts]
rag-gateway = "gateway.cli:main"
